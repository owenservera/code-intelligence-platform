[pytest]
# Pytest configuration for CIP Code Intelligence Platform

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Async test configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test paths
testpaths = tests

# Output options with coverage
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=cipkg
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml

# Minimum coverage threshold
# --cov-fail-under=80

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interaction
    interaction: User interaction tests using Pilot
    snapshot: Visual regression snapshot tests
    e2e: End-to-end workflow tests
    slow: Tests that take longer to run
    external: Tests that require external dependencies
    mcp: MCP server tests
    memory: Memory system tests
