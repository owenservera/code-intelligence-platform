# CIP Configuration v2.0
# Copy this file to .cip/config.toml and customize

[meta]
version = "2.0"
schema_version = 11

[index]
# File patterns to exclude from indexing
exclude_patterns = [
    "node_modules",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".cip",
    "dist",
    "build",
    ".next",
    "coverage",
    "*.pyc",
    "*.pyo",
    "*.so",
    "*.dylib"
]

# Maximum file size to index (bytes)
max_file_size = 1048576  # 1MB

# Chunking settings
chunk_size = 1000
chunk_overlap = 200
ast_aware_chunking = true  # Use AST boundaries instead of line counts

# Languages to index
languages = [
    "python",
    "javascript",
    "typescript",
    "tsx",
    "jsx",
    "go",
    "rust",
    "java",
    "cpp",
    "c"
]

# Test file patterns
test_globs = ["test_", "_test.", ".test.", ".spec.", "/tests/", "__tests__"]

[embed]
# Embedding backend: auto, local, service, hashing
backend = "auto"

# Model for local embeddings
model = "BAAI/bge-small-en-v1.5"

# Embedding dimensions
dim = 384

# Auto-start daemon if not running
autostart = true

# Daemon port range
daemon_port_min = 8765
daemon_port_max = 8775

# Batch size for embedding
batch_size = 32

# Service port for warm model
service_port = 8787

[retrieval]
# Hybrid search weights (semantic vs lexical)
hybrid_weight = 0.7  # 0.7 semantic, 0.3 lexical

# Maximum results to return
max_results = 20

# Enable reranking
rerank = true
rerank_model = "BAAI/bge-reranker-v2-m3"

# Graph expansion depth
graph_expansion_depth = 1

# Enable HyDE (Hypothetical Document Embeddings)
enable_hyde = false

# Legacy retrieval settings
lexical_k = 30
vector_k = 30
context_budget_tokens = 6000

[memory]
# Enable temporal knowledge graph
enable_temporal = true

# Enable episodic memory
enable_episodic = true

# Enable procedural memory
enable_procedural = true

# Memory consolidation interval (seconds)
consolidation_interval = 86400  # 24 hours

# Memory database path (relative to .cip/)
memory_db = "memory.db"
episodes_db = "episodes.db"

# Maximum episodes to keep
max_episodes = 10000

# Consolidation lookback period (days)
consolidation_lookback_days = 7

[mcp]
# MCP server settings
host = "localhost"
port = 8080

# Enable MCP server auto-start
autostart = false

# Allowed origins for CORS
allowed_origins = ["*"]

# Maximum request size (bytes)
max_request_size = 10485760  # 10MB

[daemon]
# Daemon settings
host = "localhost"
port = 8765

# Enable file watcher
enable_watcher = true

# Watcher poll interval (seconds)
watcher_interval = 5

# Cache settings
cache_size = 1000  # Number of embeddings to cache
cache_ttl = 3600   # Cache TTL in seconds

[analysis]
# Health score weights
health_weights = {
    "coverage" = 0.3,
    "quality" = 0.3,
    "recency" = 0.2,
    "complexity" = 0.2
}

# Audit settings
audit_refresh_interval = 3600  # 1 hour
max_findings = 100

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"

# Log file path (relative to .cip/)
file = "logs/cip.log"

# Max log file size (bytes)
max_size = 10485760  # 10MB

# Number of backup files
backup_count = 5

# Enable debug mode (shows swallowed exceptions)
debug = false

[performance]
# Batch size for database operations
db_batch_size = 1000

# Number of worker threads
worker_threads = 4

# Enable parallel indexing
parallel_indexing = true

# Maximum parallel workers
max_parallel_workers = 8

[ui]
# Terminal dashboard settings
dashboard_refresh_interval = 5  # seconds
dashboard_theme = "auto"  # auto, dark, light

# Enable animations
enable_animations = true

# Maximum items to show in lists
max_list_items = 50

[summary]
backend = "structural"      # structural (offline) | llm
llm_model = "gpt-4o-mini"
max_llm_per_sync = 20

[git]
depth = 500
co_change_min = 2

[rerank]
enabled = true

[vector]
backend = "sqlite"          # sqlite | sqlite-vec (experimental)

[perf]
workers = 0                 # 0 = auto (cpu_count); 1 = serial; N = explicit process count

[maintain]
event_days = 30

[audit]
ignore_rules = []        # e.g. ["QA-CONSOLE", "QA-ANY"]
