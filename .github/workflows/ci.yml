name: CIP CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Run linter
      run: |
        pip install ruff
        ruff check lib/cipkg/

    - name: Run type checker
      run: |
        pip install mypy
        mypy lib/cipkg/ --ignore-missing-imports

    - name: Run tests
      run: |
        python -m pytest tests/ -v --cov=cipkg --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  integration:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize test repository
      run: |
        mkdir -p /tmp/test-repo
        echo "def hello(): return 'world'" > /tmp/test-repo/test.py
        cd /tmp/test-repo
        cip init
        cip index --all

    - name: Run integration tests
      run: |
        cd /tmp/test-repo
        cip selftest
        cip analyze
        cip audit

    - name: Test MCP server
      run: |
        cd /tmp/test-repo
        timeout 10 cip mcp-server --port 8080 &
        sleep 5
        curl -f http://localhost:8080/health || exit 1

  release:
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: twine upload dist/*
