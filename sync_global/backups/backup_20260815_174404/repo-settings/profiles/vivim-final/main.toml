# Vivim-Final Main Profile
# Repository: C:\0-BlackBoxProject-0\vivim-final
# Purpose: 13-layer engine architecture with Prisma, Tauri, Next.js

[profile.vivim]
include = [
  "src",                    # Backend source (13 engine layers)
  "frontend/src",           # Frontend source only
  "prisma",                 # Database schema
  "seeds",                  # Data & provider manifests
  "devops",                 # Dev tools
  "scripts",                # Build scripts
  "shared"                  # Shared utilities
]
exclude = [
  "src/generated",          # Generated code (62MB)
  "seeds/taxonomy",         # Taxonomy data (7.9MB)
  "devops/opencode",        # Third-party code
  "context-pack-md",       # Context packs
  "context-pack.zip",
  "prisma/migrations.bak",  # Backup migrations
  "frontend/node_modules",  # Dependencies
  "frontend/.next",         # Next.js cache
  "frontend/out",           # Build output
  "frontend/playwright-report",
  "frontend/test-results",
  "frontend/tool-results",
  "frontend/download",
  "claude-investigate",
  "intelligence-pack-acu-dcb-storage",
]
