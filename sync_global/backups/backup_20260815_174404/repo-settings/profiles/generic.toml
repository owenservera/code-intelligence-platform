# Generic CIP Profile
# Purpose: Default profile for unrecognized repositories

[profile.generic]
exclude = [
  "node_modules", "dist", "build", "out", ".next", ".nuxt",
  "__pycache__", ".venv", "venv", "target", "vendor", "coverage",
  ".pytest_cache", ".mypy_cache", ".idea", ".vscode", ".turbo",
  ".cache", "tmp",
]
