# CIP Global Sync Configuration

[sync]
source = "."                    # Local repo root (relative to script)
target = "~/.cip-global"        # Global CIP installation
backup_enabled = true
backup_location = "./sync_global/backups"
log_level = "INFO"

[items]
files = [
    "repo-settings",
    "lib/cipkg/base.py",
    "config.default.toml",
    "lib/cipkg/init_detector.py",
    "lib/cipkg/terminal_dashboard.py",
    "lib/cipkg/interactive_ui.py",
    "lib/cipkg/interactive.py",
    "lib/cipkg/command_registry.py",
    "lib/cipkg/intelligent_executor.py",
    "lib/cipkg/context_manager.py",
    "lib/cipkg/learning_system.py",
    "lib/cipkg/suggestion_engine.py",
    "lib/cipkg/workflow_engine.py",
    "lib/cipkg/command_adapter.py",
    "lib/cipkg/error_system.py",
    "lib/cipkg/help_system.py",
    "bin/cip",
    "bin/cip.py",
    "config.v2.default.toml"
]

[validation]
pre_sync_checks = true
post_sync_tests = true
cip_command_tests = true

[rollback]
enabled = true
max_backups = 5
auto_rollback_on_failure = true
