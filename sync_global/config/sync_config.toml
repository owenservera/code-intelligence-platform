# CIP Global Sync Configuration

[sync]
source = "."                    # Local repo root (relative to script)
target = "~/.cip-global"        # Global CIP installation
backup_enabled = true
backup_location = "./sync_global/backups"
log_level = "INFO"

[items]
# Auto-discovery patterns - these will be automatically expanded to matching files
patterns = [
    "repo-settings/**/*",
    "lib/cipkg/*.py",
    "config.default.toml",
    "config.v2.default.toml",
    "bin/*"
]

# Exclusion patterns - files matching these will NOT be synced
exclude_patterns = [
    "**/__pycache__/**",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "**/.pytest_cache/**",
    "**/.mypy_cache/**"
]

# Explicit files (fallback for files that don't match patterns)
files = [
    # Add specific files here if they don't match patterns above
]

[validation]
pre_sync_checks = true
post_sync_tests = true
cip_command_tests = true

[rollback]
enabled = true
max_backups = 5
auto_rollback_on_failure = true
