[index]
max_file_kb = 512
exclude = []
test_globs = ["test_", "_test.", ".test.", ".spec.", "/tests/", "__tests__"]

# Repo-specific profiles (opt-in via profile = "name" in .cip/config.toml)
[profile.vivim]
exclude = [
  "src/generated", "seeds/taxonomy", "devops/opencode",
  "context-pack-md", "context-pack.zip",
  "prisma/migrations.bak", "frontend/playwright-report",
  "frontend/tool-results", "frontend/test-results",
  "frontend/download", "claude-investigate", "intelligence-pack-acu-dcb-storage",
]

# External search integration (for repos with their own search tools)
[external_search]
# Defer raw snippet retrieval to external command instead of CIP's vector store
# defer_to = "code-index"  # Command name to run (e.g., "bun run devops code-index")
# args = ["search", "{query}"]  # Arguments template, {query} will be replaced

[embed]
backend = "auto"           # auto | service | local | hashing
model = "BAAI/bge-small-en-v1.5"
dim = 384
service_port = 8787        # where the warm model lives
autostart = true           # launch the daemon automatically if it's down

[retrieval]
lexical_k = 30
vector_k = 30
context_budget_tokens = 6000

[serve]
port = 8787

# ---- v1.0 ----
[summary]
backend = "structural"      # structural (offline) | llm
llm_model = "gpt-4o-mini"
max_llm_per_sync = 20

[git]
depth = 500
co_change_min = 2

[rerank]
enabled = true

[vector]
backend = "sqlite"          # sqlite | sqlite-vec (experimental)

# ---- v2 performance ----
[perf]
workers = 0                 # 0 = auto (cpu_count); 1 = serial; N = explicit process count

[maintain]
event_days = 30

# ---- v1.1 stack pack ----
[audit]
ignore_rules = []        # e.g. ["QA-CONSOLE", "QA-ANY"]
